
name: Infrastructure

on:
  push:
    branches:
      - master
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infrastructure
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    name: Apply Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check

      - name: Initialise
        run: tofu init -input=false -lockfile=readonly

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -input=false -no-color

      - name: Apply
        id: apply
        run: tofu apply -input=false -auto-approve -no-color

      - name: Verify encrypted state
        id: state
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        run: |
          jq -e 'has("encrypted_data") and has("encryption_version")' terraform.tfstate > /dev/null

      - name: Preserve encrypted state
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: opentofu-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: infrastructure/terraform.tfstate
          if-no-files-found: error
          retention-days: 30

      - name: Commit encrypted state
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        run: |
          git add terraform.tfstate

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(infrastructure): update OpenTofu state"
          git push origin HEAD:master
