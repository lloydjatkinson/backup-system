name: Infrastructure

on:
  push:
    branches: [master]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infrastructure
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    name: Apply infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0 # Full history: the state-push retry below rebases onto master.

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Install restic
        run: bash scripts/install-restic.sh

      - name: Check formatting
        run: tofu fmt -check

      - name: Initialise
        run: tofu init -input=false -lockfile=readonly

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -input=false -no-color

      - name: Apply
        id: apply
        run: tofu apply -input=false -auto-approve -no-color

      # Persist state right after apply; the generated passwords live only in state.
      - name: Commit encrypted state
        id: commit_state
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        run: |
          jq -e 'has("encrypted_data") and has("encryption_version")' terraform.tfstate >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraform.tfstate
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore(infrastructure): update OpenTofu state"

          # master can move between checkout and push; rebase onto it and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::state push failed; reconcile manually before re-running"
          exit 1

      - name: Verify repositories
        if: ${{ steps.apply.outcome == 'success' }}
        run: bash scripts/check-repos.sh